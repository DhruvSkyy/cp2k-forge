[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cp2k-forge"
version = "0.1.0"
description = "Forge compact system-specific MACE potentials, with CP2K as the DFT labelling engine"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dhruv Sharma", email = "ds2173@cam.ac.uk" }]
requires-python = ">=3.9"
keywords = ["machine-learned potentials", "MACE", "CP2K", "DFT", "molecular dynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
# Core keeps the torch-free paths usable (config load, CP2K I/O, doctor, tests);
# MD generation and training need the [train] extra.
dependencies = [
    "numpy",
    "pyyaml",
    "ase>=3.23",
    "scikit-learn",
]

[project.optional-dependencies]
train = [
    "mace-torch>=0.3.16",
    "torch-dftd",
]
plot = ["matplotlib"]

[project.scripts]
cp2k-forge = "cp2k_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cp2k_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
