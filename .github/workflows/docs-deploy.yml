# Deploy the documentation site to GitHub Pages, on demand.
#
# Dispatch-gated on purpose: while the repository is private, a Pages deploy either
# fails (free plan) or publishes the site publicly (paid plan). Run this workflow from
# the Actions tab once the repository is public (enable Pages with source
# "GitHub Actions" in Settings first).
name: docs-deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (docs)
        run: python -m pip install -e ".[docs]"
      - name: Build site (strict)
        run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
