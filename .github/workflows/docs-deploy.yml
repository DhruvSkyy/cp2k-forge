# Deploy the documentation site to GitHub Pages, on demand.
#
# Dispatch-gated on purpose: the repository is public and Pages is live at
# https://www.dhruvs.com/cp2k-forge/, but docs only redeploy when explicitly
# triggered (Actions tab -> docs-deploy -> Run workflow), not on every push.
name: docs-deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (docs)
        run: python -m pip install -e ".[docs]"
      - name: Build site (strict)
        run: sphinx-build -M dirhtml docs docs/_build -W --keep-going
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/dirhtml
      - id: deployment
        uses: actions/deploy-pages@v4
