name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Core install only: the parser tests and the CLI are deliberately torch-free,
      # so CI stays fast and never downloads GPU wheels. The mock end-to-end run
      # (configs/smoke.yaml) needs the [train] extra and stays a local check.
      - name: Install (core, torch-free)
        run: python -m pip install -e . black pytest
      - name: Format check
        run: black --check .
      - name: Unit tests
        run: pytest -q
      - name: CLI sanity
        run: |
          python -c "import cp2k_forge"
          cp2k-forge --help

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Editable install gives autodoc the real package plus its core deps.
      - name: Install (docs)
        run: python -m pip install -e ".[docs]"
      - name: Build site (strict)
        run: sphinx-build -M dirhtml docs docs/_build -W --keep-going
